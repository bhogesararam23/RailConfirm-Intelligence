[project]
name = "railconfirm"
version = "0.1.0"
description = "RailConfirm Intelligence — local-first Indian Railways ticket confirmation probability estimation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0,<1.0",
    "uvicorn[standard]>=0.29.0,<1.0",
    "pydantic>=2.7.0,<3.0",
    "pydantic-settings>=2.2.0,<3.0",
    "python-multipart>=0.0.9,<0.1",
    "httpx>=0.27.0,<1.0",
    "pandas>=2.2.0,<4.0",
    "numpy>=1.26.0,<3.0",
    "scipy>=1.13.0,<2.0",
    "scikit-learn>=1.5.0,<2.0",
    "joblib>=1.4.0,<2.0",
    "PyYAML>=6.0.1,<7.0",
    "python-dateutil>=2.9.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<10.0",
    "pytest-asyncio>=0.23.0,<2.0",
    "pytest-cov>=5.0.0,<8.0",
    "coverage>=7.5.0,<8.0",
    "ruff>=0.16.9,<0.18",
    "mypy>=1.19.0,<3.0",
    "types-PyYAML>=6.0.12,<7.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["railconfirm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# The rule set is declared rather than inherited from a ruff version's defaults:
# with `select` omitted, upgrading ruff silently changes which rules run, so the
# same commit passed locally and failed CI on 2026-10-22 (ruff 0.16.9 enabled
# DTZ001 by default, 0.17.2 did not). Timezone discipline is a product
# requirement here, not a stylistic preference, so DTZ stays selected.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E4",    # pycodestyle import rules
    "E7",    # pycodestyle statement rules
    "E9",    # pycodestyle runtime errors
    "F",     # pyflakes
    "I",     # import order, so new modules sort the same way everywhere
    "B",     # bugbear: loop-variable capture, unary misuse, and similar defects
    "DTZ",   # naive datetime use — as-of timestamps decide what may be used
    "C4",    # comprehension/iterator misuse
    "RUF100",  # unused noqa, so suppressions cannot outlive the rule they silenced
]

[tool.ruff.lint.per-file-ignores]
# Prediction timestamps are intentionally wall-clock at one boundary each.
"railconfirm/domain/passenger.py" = ["DTZ005"]
"railconfirm/domain/prediction.py" = ["DTZ005"]
"railconfirm/inference/engine.py" = ["DTZ005"]

# Type checking is configured here so CI and a developer run the same checks.
# CI previously passed `--ignore-missing-imports` on the command line only, which
# meant an unconfigured `mypy` locally behaved differently from CI. The pydantic
# mypy plugin is deliberately not enabled: it has not been run against the mypy
# and pydantic versions CI resolves, and an unverifiable check is not a gate.
[tool.mypy]
python_version = "3.11"
files = ["railconfirm"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.coverage.run]
branch = true
source = ["railconfirm"]

[tool.coverage.report]
show_missing = true
skip_covered = false
