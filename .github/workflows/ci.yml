name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# No external runtime APIs, no private datasets, no model weights required.
# All checks must pass without credentials or network access to third-party services.

jobs:
  backend-checks:
    name: Backend — lint, type-check, and tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Create virtual environment and install dependencies
        run: |
          uv venv .venv
          source .venv/bin/activate
          uv pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          source .venv/bin/activate
          ruff check railconfirm/ tests/

      - name: Type-check with mypy
        run: |
          source .venv/bin/activate
          mypy railconfirm/ --ignore-missing-imports

      - name: Run tests with coverage
        run: |
          source .venv/bin/activate
          pytest tests/ -v --tb=short --cov=railconfirm --cov-report=term-missing
        # These tests must not require external APIs or private datasets.
        # Synthetic fixtures are clearly labelled in tests/fixtures/.

  frontend-checks:
    name: Frontend — type-check and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # No real API endpoint during CI build — frontend must build without live backend
          NEXT_PUBLIC_API_URL: http://localhost:8000

  docs-checks:
    name: Documentation and Security Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check for required documentation files
        run: |
          required_files=(
            "README.md"
            "CHANGELOG.md"
            "AGENTS.md"
            "docs/ROADMAP.md"
            "docs/PROJECT_STATUS.md"
            "docs/AGENT_HANDOFF.md"
            "docs/DEVELOPMENT_LOG.md"
            "docs/technical/IMPLEMENTATION_PLAN.md"
            "docs/technical/LOCAL_FIRST_DEVELOPMENT.md"
            "docs/data/DATASET_INTAKE_CHECKLIST.md"
            "docs/data/SOURCE_REGISTER.md"
            "docs/adr/README.md"
          )
          missing=0
          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "MISSING: $f"
              missing=1
            fi
          done
          if [ $missing -ne 0 ]; then
            echo "Required documentation files are missing."
            exit 1
          fi
          echo "All required documentation files present."

      - name: Check no secrets or private data committed
        run: |
          # Simple scan for patterns that should never be committed
          if grep -r "pnr" --include="*.py" --include="*.ts" --include="*.json" -l 2>/dev/null | grep -v "test\|spec\|fixture\|__pycache__\|node_modules" | head -5; then
            echo "Warning: PNR references found in non-test files — review for sensitive data"
          fi
          # Check no .env files committed (other than .env.example)
          if find . -name ".env" -not -name ".env.example" -not -path "./.git/*" | grep -q .; then
            echo "ERROR: .env file found — must not be committed"
            exit 1
          fi
          echo "Secret/privacy scan passed."
