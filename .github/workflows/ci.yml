name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# No external runtime APIs, no private datasets, no model weights required.
# Every job must pass without credentials or network access to third-party services.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Backend — lint, type-check, and tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      # Tool behaviour is declared in pyproject.toml (Ruff rule set, Mypy config),
      # and dev dependency ranges are constrained there, so CI and a developer
      # running the same commit see the same results.
      - name: Create virtual environment and install dependencies
        run: |
          uv venv .venv
          source .venv/bin/activate
          uv pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          source .venv/bin/activate
          ruff check railconfirm/ tests/

      - name: Type-check with mypy
        run: |
          source .venv/bin/activate
          mypy

      - name: Run tests with coverage
        run: |
          source .venv/bin/activate
          pytest tests/ -v --tb=short --cov=railconfirm --cov-report=term-missing --cov-fail-under=90
        # These tests must not require external APIs or private datasets.
        # Synthetic fixtures are clearly labelled in tests/fixtures/.

  frontend-checks:
    name: Frontend — type-check and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # No real API endpoint during CI build — the frontend must build without a live backend
          NEXT_PUBLIC_API_URL: http://localhost:8000

  repository-hygiene:
    name: Documentation, privacy and link checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run repository hygiene checks
        run: python scripts/check_repository_hygiene.py

      - name: Verify the workflow file is syntactically valid YAML
        run: |
          pip install --quiet PyYAML==6.0.2
          python -c "import yaml; yaml.safe_load(open('.github/workflows/ci.yml')); print('ci.yml parses')"
